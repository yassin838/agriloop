<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titre de la page | AgriLoop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>AgriLoop</a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="#accueil">Accueil</a>

        <a href="#dons">Dons</a>
        <a href="#parcelles">Parcelles</a>

      </nav>
    </header>

    <main class="content">
      <!-- Remplacez le titre et les champs ci-dessous pour créer une nouvelle page. -->
      <h1>Titre du formulaire</h1>
      <form class="form-grid" action="#" method="post">
        <div class="field">
          <label for="champ-1">Nom du champ <span aria-hidden="true">*</span></label>
          <input id="champ-1" name="champ_1" type="text" required>
        </div>

        <div class="field">
          <label for="champ-2">Autre champ <span aria-hidden="true">*</span></label>
          <select id="champ-2" name="champ_2" required>
            <option value="" selected disabled>Choisir...</option>
            <option value="option-1">Option 1</option>
            <option value="option-2">Option 2</option>
          </select>
        </div>

        <button type="submit">Envoyer</button>
      </form>
    </main>
  </div>
</body>
</html>
