<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriLoop — Signaler un avis</title>
  <link rel="stylesheet" href="signalement.css">
</head>
<body>
  <header>
    <a class="logo" href="avis.html">AgriLoop</a>
    <nav>
      <a href="avis.html">Avis</a>
      <a href="signalement.html" class="active">Signaler un avis</a>
    </nav>
  </header>

  <main>
    <h1>Signaler un avis</h1>
    <form id="formSignalement" novalidate>
      <div class="champ">
        <label for="avis">Avis *</label>
        <select id="avis" name="avis" required>
          <option value="" disabled selected>Choisir...</option>
          <option value="">Chargement des avis...</option>
        </select>
        <div class="erreur" id="err-avis"></div>
      </div>
      <div class="champ">
        <label for="motif">Motif *</label>
        <select id="motif" name="motif" required>
          <option value="" disabled selected>Choisir...</option>
          <option value="spam">Spam</option>
          <option value="injurieux">Propos injurieux</option>
          <option value="faux">Faux avis</option>
          <option value="autre">Autre</option>
        </select>
        <div class="erreur" id="err-motif"></div>
      </div>
      <div class="champ pleine-largeur">
        <label for="description">Description *</label>
        <textarea id="description" name="description" required></textarea>
        <div class="erreur" id="err-description"></div>
      </div>
      <div class="actions"><button type="submit">Envoyer</button></div>
      <p class="message" id="message">Merci, votre signalement a bien été envoyé.</p>
    </form>
  </main>

  <script>
    const form = document.getElementById('formSignalement');
    const avisSelect = document.getElementById('avis');
    const postsKey = 'agriloopPosts';
    const reportsKey = 'agriloopReports';
    const postsInitial = [
      {
        id: 'exemple-1',
        titre: 'Produit tres frais',
        note: 5,
        fraicheur: 5,
        commentaire: 'Les tomates etaient vraiment fraiches et bien emballees. Je recommande !'
      }
    ];

    let posts = [];
    try {
      posts = JSON.parse(localStorage.getItem(postsKey)) || postsInitial;
    } catch (error) {
      posts = [];
    }

    function echapperTexte(text) {
      const element = document.createElement('span');
      element.textContent = text;
      return element.innerHTML;
    }

    avisSelect.innerHTML = '<option value="" disabled selected>Choisir...</option>' +
      posts.map((post, index) =>
        `<option value="${echapperTexte(String(post.id))}">${echapperTexte(post.titre || 'Avis n°' + (index + 1))}</option>`
      ).join('');

    const avisParam = new URLSearchParams(window.location.search).get('avis');
    if (avisParam && posts.some(post => String(post.id) === avisParam)) {
      avisSelect.value = avisParam;
    }

    const regles = {
      avis: v => v ? '' : 'Veuillez choisir un avis.',
      motif: v => v ? '' : 'Veuillez choisir un motif.',
      description: v => v.trim() ? '' : 'La description est obligatoire.'
    };

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      let valide = true;
      for (const champ in regles) {
        const message = regles[champ](form.elements[champ].value);
        document.getElementById('err-' + champ).textContent = message;
        if (message) valide = false;
      }
      if (!valide) return;

      const postId = form.elements.avis.value;
      const post = posts.find(item => String(item.id) === postId);
      if (!post) {
        document.getElementById('err-avis').textContent = 'L’avis sélectionné est introuvable.';
        return;
      }

      let reports;
      try {
        reports = JSON.parse(localStorage.getItem(reportsKey) || '[]');
        if (!Array.isArray(reports)) throw new Error('Stored reports are not a list.');
      } catch (error) {
        document.getElementById('err-description').textContent =
          'Les signalements enregistrés ne peuvent pas être lus dans ce navigateur.';
        return;
      }
      reports.push({
        id: Date.now(),
        date: new Date().toISOString().slice(0, 10),
        avisId: postId,
        titreAvis: post.titre,
        motif: form.elements.motif.value,
        description: form.elements.description.value.trim(),
        statut: 'attente'
      });
      try {
        localStorage.setItem(reportsKey, JSON.stringify(reports));
      } catch (error) {
        document.getElementById('err-description').textContent =
          'Le signalement ne peut pas être enregistré dans ce navigateur.';
        return;
      }

      document.getElementById('message').style.display = 'block';
      form.reset();
    });
  </script>
</body>
</html>
