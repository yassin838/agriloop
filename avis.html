<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriLoop — Laisser un avis</title>
  <link rel="stylesheet" href="avis.css">
</head>
<body>

    <a class="logo" href="avis.html">AgriLoop</a>
    <nav>
      <a href="avis.html" class="active">Avis</a>
      <a href="signalement.html">Signaler un avis</a>
    </nav>
  </header>

  <main>
    <h1>Laisser un avis</h1>
    <form id="formAvis" novalidate>
      <div class="champ">
        <label for="offre">Offre *</label>
        <select id="offre" name="offre" required>
          <option value="" disabled selected>Choisir...</option>
          <option value="1">Tomates bio</option>
          <option value="2">Pommes de terre</option>
          <option value="3">Oranges</option>
        </select>
        <div class="erreur" id="err-offre"></div>
      </div>
      <div class="champ">
        <label for="titre">Titre *</label>
        <input type="text" id="titre" name="titre" required>
        <div class="erreur" id="err-titre"></div>
      </div>
      <div class="champ">
        <label for="note">Note *</label>
        <input type="number" id="note" name="note" min="1" max="5" required>
        <div class="erreur" id="err-note"></div>
      </div>
      <div class="champ">
        <label for="fraicheur">Fraîcheur du produit *</label>
        <input type="number" id="fraicheur" name="fraicheur" placeholder="0" min="0" max="5" required>
        <div class="erreur" id="err-fraicheur"></div>
      </div>
      <div class="champ pleine-largeur">
        <label for="commentaire">Commentaire *</label>
        <textarea id="commentaire" name="commentaire" required></textarea>
        <div class="erreur" id="err-commentaire"></div>
      </div>
      <div class="actions">
        <button type="submit">Envoyer</button>
      </div>
      <p class="message" id="message">Merci, votre avis a bien été envoyé.</p>
    </form>

    <section class="feed" id="feed" aria-label="Avis de la communauté">
      <div class="feed-header"><h2>Publications recentes</h2></div>
      <div id="posts"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('formAvis');
    const postsContainer = document.getElementById('posts');
    const postsInitial = [
      {
        id: 'exemple-1',
        auteur: 'Sami Ben Ali',
        offre: 'Tomates bio',
        titre: 'Produit tres frais',
        note: 5,
        fraicheur: 5,
        commentaire: 'Les tomates etaient vraiment fraiches et bien emballees. Je recommande !',
        likes: 12,
        upvotes: 8,
        downvotes: 1,
        liked: false,
        vote: null,
        comments: [
          { auteur: 'Maya', texte: 'La livraison a aussi ete rapide.' }
        ]
      }
    ];

    let posts = [];
    try {
      posts = JSON.parse(localStorage.getItem('agriloopPosts')) || postsInitial;
    } catch (error) {
      posts = postsInitial;
    }
    if (!localStorage.getItem('agriloopPosts')) {
      localStorage.setItem('agriloopPosts', JSON.stringify(posts));
    }

    function sauvegarder() {
      localStorage.setItem('agriloopPosts', JSON.stringify(posts));
    }

    function echapperTexte(text) {
      const element = document.createElement('span');
      element.textContent = text;
      return element.innerHTML;
    }

    function afficherPosts() {
      postsContainer.innerHTML = '';
      posts.forEach(post => {
        const article = document.createElement('article');
        article.className = 'post';
        article.dataset.postId = post.id;
        article.innerHTML = `
          <div class="post-entete">
            <div class="avatar">${echapperTexte(post.auteur.charAt(0).toUpperCase())}</div>
            <div>
              <strong>${echapperTexte(post.auteur)}</strong>
              <span class="post-meta">${echapperTexte(post.offre)} · A l'instant</span>
            </div>
          </div>
          <h3>${echapperTexte(post.titre)}</h3>
          <div class="post-notes">
            <span>Note : <b>${echapperTexte(String(post.note))}/5</b></span>
            <span>Fraicheur : <b>${echapperTexte(String(post.fraicheur))}/5</b></span>
          </div>
          <p class="post-commentaire">${echapperTexte(post.commentaire)}</p>
          <div class="post-compteurs">
            <span>${echapperTexte(String(post.likes))} J'aime</span>
            <span>${post.comments.length} commentaire(s)</span>
          </div>
          <div class="post-actions">
            <button type="button" class="post-action like ${post.liked ? 'active' : ''}" data-action="like">J'aime</button>
            <button type="button" class="post-action vote ${post.vote === 'up' ? 'active' : ''}" data-action="up">&#9650; <span>${echapperTexte(String(post.upvotes))}</span></button>
            <button type="button" class="post-action vote ${post.vote === 'down' ? 'active' : ''}" data-action="down">&#9660; <span>${echapperTexte(String(post.downvotes))}</span></button>
            <button type="button" class="post-action" data-action="comment">Commenter</button>
            <button type="button" class="post-action report" data-action="report">Signaler</button>
          </div>
          <div class="comments">
            ${post.comments.map(comment => `
              <div class="comment">
                <div class="comment-avatar">${echapperTexte(comment.auteur.charAt(0).toUpperCase())}</div>
                <div class="comment-bulle">
                  <strong>${echapperTexte(comment.auteur)}</strong>
                  <span>${echapperTexte(comment.texte)}</span>
                </div>
              </div>
            `).join('')}
            <form class="comment-form">
              <input type="text" name="commentaire" placeholder="Ecrire un commentaire..." required>
              <button type="submit">Publier</button>
            </form>
          </div>
        `;
        postsContainer.appendChild(article);
      });
    }

    const regles = {
      offre: v => v ? '' : 'Veuillez choisir une offre.',
      titre: v => v.trim() ? '' : 'Le titre est obligatoire.',
      note: v => (v !== '' && v >= 1 && v <= 5) ? '' : 'La note doit être comprise entre 1 et 5.',
      fraicheur: v => (v !== '' && v >= 0 && v <= 5) ? '' : 'La fraîcheur doit être comprise entre 0 et 5.',
      commentaire: v => v.trim() ? '' : 'Le commentaire est obligatoire.'
    };

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      let valide = true;
      for (const champ in regles) {
        const message = regles[champ](form.elements[champ].value);
        document.getElementById('err-' + champ).textContent = message;
        if (message) valide = false;
      }

      if (!valide) return;

      document.getElementById('message').style.display = 'block';
      const offreSelect = form.elements.offre;
      posts.unshift({
        id: 'post-' + Date.now(),
        auteur: 'Vous',
        offre: offreSelect.options[offreSelect.selectedIndex].text,
        titre: form.elements.titre.value.trim(),
        note: Number(form.elements.note.value),
        fraicheur: Number(form.elements.fraicheur.value),
        commentaire: form.elements.commentaire.value.trim(),
        likes: 0,
        upvotes: 0,
        downvotes: 0,
        liked: false,
        vote: null,
        comments: []
      });
      sauvegarder();
      afficherPosts();
      form.reset();
    });

    postsContainer.addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const article = button.closest('.post');
      const post = posts.find(item => item.id === article.dataset.postId);
      if (!post) return;

      const action = button.dataset.action;
      if (action === 'like') {
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;
      } else if (action === 'up') {
        if (post.vote === 'up') {
          post.upvotes--;
          post.vote = null;
        } else {
          if (post.vote === 'down') post.downvotes--;
          post.upvotes++;
          post.vote = 'up';
        }
      } else if (action === 'down') {
        if (post.vote === 'down') {
          post.downvotes--;
          post.vote = null;
        } else {
          if (post.vote === 'up') post.upvotes--;
          post.downvotes++;
          post.vote = 'down';
        }
      } else if (action === 'comment') {
        article.querySelector('.comment-form input').focus();
        return;
      } else if (action === 'report') {
        window.location.href = 'signalement.html?avis=' + encodeURIComponent(post.id);
        return;
      }

      sauvegarder();
      afficherPosts();
    });

    postsContainer.addEventListener('submit', function (event) {
      const commentForm = event.target.closest('.comment-form');
      if (!commentForm) return;
      event.preventDefault();
      const texte = commentForm.elements.commentaire.value.trim();
      if (!texte) return;

      const article = commentForm.closest('.post');
      const post = posts.find(item => item.id === article.dataset.postId);
      if (!post) return;

      post.comments.push({ auteur: 'Vous', texte });
      sauvegarder();
      afficherPosts();
    });

    afficherPosts();
  </script>
</body>
</html>
